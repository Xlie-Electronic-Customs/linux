%YAML 1.2
---
$id: http://devicetree.org/schemas/net/bluetooth/qcom,bluetooth-common.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Qualcomm Bluetooth Common Properties

maintainers:
  - Balakrishna Godavarthi <quic_bgodavar@quicinc.com>
  - Rocky Liao <quic_rjliao@quicinc.com>

properties:
  firmware-name:
    minItems: 1
    items:
      - description: specify the name of nvm firmware to load
      - description: specify the name of rampatch firmware to load

  qcom,local-bd-address-broken:
    type: boolean
    description:
      boot firmware is incorrectly passing the address in big-endian order

  qcom,brahma-peri-baudrate:
    type: boolean
    description:
      Indicates that the UART baud rate must be raised through the peripheral
      subsystem (the vendor peri-subsystem baud command) instead of the
      BT-subsystem vendor baud command. Needed by the WCN7860/BRAHMA combo
      chip, whose ROM silently ignores the BT-subsystem baud VSC. Must not be
      set on plain WCN7850 boards, which expect the standard BT-subsystem
      baud VSC.

additionalProperties: true
